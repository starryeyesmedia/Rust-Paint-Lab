[package]
name = "canvas-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
paint-input = { path = "../../crates/input" }
paint-stroke = { path = "../../crates/stroke" }
paint-document = { path = "../../crates/document" }
egui = "=0.33.3"
egui-winit = { version = "=0.33.3", default-features = false, features = ["x11", "wayland", "clipboard", "accesskit"] }
egui-wgpu = { version = "=0.33.3", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "gles", "wgsl"] }
winit = "=0.30.13"
pollster = "=0.4.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "=0.15.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_Pointer", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Performance"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "=0.30.13", features = ["android-native-activity"] }

[package.metadata.android]
package = "com.starryeyesmedia.bitchpixel"
apk_name = "bitchpixel"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "BitchPixel"
debuggable = true
uses_cleartext_traffic = false
theme = "@android:style/Theme.Material.NoActionBar"

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "canvas_demo"

[lints]
workspace = true

[[test]]
name = "gpu_smoke"
harness = false
